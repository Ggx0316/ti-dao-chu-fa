		function submit(choice){if(answered)return;answered=true;clearInterval(timerId);const q=questions[index],isRight=choice===q.a,buttons=[...document.querySelectorAll(".answer")];buttons.forEach(b=>b.disabled=true);buttons[q.a].classList.add("correct");if(isRight){correctCount++;streak++;best=Math.max(best,streak);const points=100+Math.max(0,seconds)*5+Math.max(0,streak-1)*20;score+=points;el("score").textContent=String(score).padStart(4,"0");el("streak").textContent=`✦ 连击 ${streak}`;el("feedback-text").innerHTML=`<strong>答对啦 +${points}！</strong> ${q.n}`;el("mascot-line").textContent=streak>=3?"连击好厉害！小岛都在发光了 ✦":"答对啦！继续保持这个节奏。";confetti()}else{if(choice>=0)buttons[choice].classList.add("wrong");lives--;streak=0;el("hearts").textContent="♥".repeat(lives)+"♡".repeat(3-lives);el("hearts").setAttribute("aria-label",`${lives} 条生命`);el("streak").textContent="✦ 连击 0";el("feedback-text").innerHTML=`<strong>${choice<0?"时间到啦！":"差一点点！"}</strong> ${q.n}`;el("mascot-line").textContent=lives===1?"还剩一颗心，深呼吸，稳住！":"没关系，记住这个知识点就赚到啦。";el("panel").classList.remove("shake-panel");void el("panel").offsetWidth;el("panel").classList.add("shake-panel")}el("hint").disabled=true;el("feedback").classList.add("show-next");el("next").textContent=lives<=0||index===total-1?"查看成绩 →":"下一题 →"}
		function useHint(){if(hinted||answered)return;hinted=true;const q=questions[index],buttons=[...document.querySelectorAll(".answer")],wrong=buttons.filter((_,i)=>i!==q.a&&!buttons[i].classList.contains("eliminated")),target=wrong[Math.floor(Math.random()*wrong.length)];if(target){target.classList.add("eliminated");target.disabled=true}el("feedback-text").textContent=q.h;el("hint").disabled=true;el("hint").textContent="已使用"}
		function finish(){clearInterval(timerId);view("result");const isVocab=studyMode==="flash",cleared=isVocab?wordIndex>=wordQueue.length:index>=total&&lives>0;el("result-mode").textContent=mode==="cet4"?`四级${isVocab?"背单词":"答题闯关"}`:mode==="cet6"?`六级${isVocab?"背单词":"答题闯关"}`:"高考加把劲";el("result-title").textContent=cleared?(isVocab?"这一轮背完啦！":"漂亮通关！"):"再练一局？";el("result-copy").textContent=isVocab?`认识 ${wordsKnown} 个，标记复习 ${wordsToReview} 个。多看几遍，记得更牢。`:cleared?"整条航线都被你点亮了。今天的努力，岛上都看见啦。":"每一次错题，都是下一次进步的小路标。岛上一直等你回来。";el("sticker").textContent=cleared?"🏆":"🌱";el("final-score").textContent=String(score).padStart(4,"0");el("final-correct").textContent=String(isVocab?wordsKnown:correctCount);el("final-streak").textContent=String(best);document.querySelector(".result-stats span:first-child").innerHTML=isVocab?`认识 <strong>${wordsKnown}</strong> 个单词`:`答对 <strong>${correctCount}</strong> 题`;if(cleared)confetti(32)}
		function confetti(amount=16){const colors=["#d8f36a","#ff7059","#74d9e5","#286b49","#f2bd54"];for(let i=0;i<amount;i++){const p=document.createElement("span");p.className="confetti";p.style.left=`${Math.random()*100}vw`;p.style.background=colors[i%colors.length];p.style.setProperty("--drift",`${Math.random()*130-65}px`);p.style.animationDelay=`${Math.random()*.18}s`;document.body.append(p);setTimeout(()=>p.remove(),1250)}}
		document.querySelectorAll(".mode-card").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));document.querySelectorAll("[data-study-mode]").forEach(button=>button.addEventListener("click",()=>setStudyMode(button.dataset.studyMode)));el("leave").addEventListener("click",()=>{clearInterval(timerId);view("home")});el("hint").addEventListener("click",useHint);el("next").addEventListener("click",()=>{index++;renderQuestion()});el("show-meaning").addEventListener("click",revealWord);el("know-word").addEventListener("click",()=>advanceWord(true));el("review-word").addEventListener("click",()=>advanceWord(false));el("replay").addEventListener("click",()=>startGame(mode));el("change-mode").addEventListener("click",()=>view("home"));
		if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(error=>console.error("Service worker registration failed:",error)))}
	</script>
